<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数字人文文本校勘</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f5ef}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #d6d0c4;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#5b3d22;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.gap{border:1px solid #ccc;border-radius:8px;padding:8px;margin:6px 0}.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff}.confirmed{background:#8a5a2b}.pending{background:#b08328}.explained{background:#4f6b46}.todo{color:#a33;font-weight:bold}.muted{color:#777}</style><h1>数字人文文本校勘</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>段落与版本对齐</h2><div class="grid"><input id="work" type="number" placeholder="作品 ID"><input id="passage" type="number" placeholder="段落 ID"><input id="witness" type="number" placeholder="版本 ID"><input id="user" type="number" placeholder="用户 ID"><input id="order" type="number" value="1"><textarea id="text" placeholder="对齐文本">春水东流，[缺页]</textarea></div><button onclick="align()">保存对齐</button><span class="muted">重复保存同一版本+段落为重对齐，缺口自动对账、不累加</span><pre id="result"></pre></section><section><h2>缺口清单</h2><input id="gapwork" type="number" placeholder="作品 ID" style="width:90px"><input id="gapuser" type="number" placeholder="负责人用户 ID" style="width:130px"><button onclick="gaps()">查看清单</button><div id="gaplist"></div></section><section><h2>异文多层修订</h2><input id="variant" type="number" placeholder="异文 ID"><input id="revision" type="number" value="0" placeholder="当前修订"><input id="reason" placeholder="取舍理由"><textarea id="proposed" placeholder="拟订文本"></textarea><button onclick="variant()">新增异文</button><button onclick="revise()">提交新层</button><button onclick="snapshot()">查看快照</button><button onclick="lock()">锁定段落</button><pre id="extra"></pre></section><script>
const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);
async function get(u,e='#result'){show(e,await(await fetch(u)).json())}
async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}
async function state(){show('#state',await(await fetch('/api/state')).json())}
function align(){post('/api/alignments',{passage_id:+passage.value,witness_id:+witness.value,aligned_text:text.value,sort_order:+order.value,user_id:+user.value}).then(()=>{if(+gapwork.value)gaps()})}
function variant(){post('/api/variants',{passage_id:+passage.value,witness_id:+witness.value,proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value})}
function revise(){post('/api/variants/'+variant.value+'/revisions',{proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value},'#extra')}
function snapshot(){get('/api/passages/'+passage.value+'/snapshots/'+revision.value+'?user_id='+user.value,'#extra')}
function lock(){post('/api/passages/'+passage.value+'/lock',{user_id:+user.value,reason:'版本已定稿'},'#extra')}
async function gaps(){
  const d=await(await fetch('/api/works/'+gapwork.value+'/gaps?user_id='+gapuser.value)).json();
  if(!d.work_id){document.querySelector('#gaplist').textContent=JSON.stringify(d);return}
  const labels={confirmed:'据实缺失',pending:'待补',explained:'已说明'};
  let html='<p>合计 '+d.totals.gap_items+' 条 / '+d.totals.occurrences+' 处标记，<span class="todo">待处理 '+d.totals.todo_items+' 条</span></p>';
  for(const p of d.passages)html+='<p>段落「'+p.label+'」待办 '+p.gap_todo+' '+(p.finalizable?'<span class="tag explained">可定稿</span>':'<span class="tag pending">不可定稿</span>')+'</p>';
  for(const w of d.witnesses){
    html+='<div class="gap"><b>'+w.siglum+'</b> <span class="muted">('+w.kind+')</span> 缺口 '+w.gaps.length+' 条，待办 <b class="'+(w.todo_count?'todo':'')+'">'+w.todo_count+'</b>';
    for(const g of w.gaps){
      html+='<div class="gap">段落「'+g.passage_label+'」 '+g.mark_label+' ×'+g.occurrences
        +' <span class="tag '+g.disposition+'">'+g.disposition_label+'</span>'
        +(g.handled?'':' <span class="todo">未处理</span>')
        +'<div class="muted">当前文本：'+g.current_text+(g.current_revision?' ｜ 当前修订(L'+g.current_revision.layer+')：'+g.current_revision.proposed_text:'')+'</div>'
        +(g.handling_note?'<div>说明（'+(g.note_by_name||'')+'）：'+g.handling_note+'</div>':'')
        +'<input id="note_'+g.id+'" placeholder="处理说明" style="width:55%" value="'+(g.handling_note||'').replace(/"/g,'&quot;')+'">'
        +'<select id="disp_'+g.id+'">'+Object.keys(labels).map(k=>'<option value="'+k+'"'+(k===g.disposition?' selected':'')+'>'+labels[k]+'</option>').join('')+'</select>'
        +'<button onclick="handle('+g.id+')">保存说明</button></div>';
    }
    html+='</div>';
  }
  document.querySelector('#gaplist').innerHTML=html;
}
async function handle(id){
  const r=await(await fetch('/api/gaps/'+id+'/handling',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({disposition:document.querySelector('#disp_'+id).value,note:document.querySelector('#note_'+id).value,user_id:+gapuser.value})}).json());
  if(r.ok)gaps();else alert(r.error);
}
state()</script></html>
